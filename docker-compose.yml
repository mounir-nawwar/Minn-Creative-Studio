version: '3.8'

services:
  minn-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minn-studio
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Persistent SQLite database folder on host
      - ./data:/app/data
      # Persistent media assets storage folder on host
      - ./storage:/app/storage
      # Mount .env file containing host secrets
      - ./.env:/app/.env:ro
      # Mount Service Account Key & Gcloud ADC Credentials
      - /home/ubuntu/.config/gcloud/minn-key.json:/app/minn-key.json:ro
      - /home/ubuntu/.config/gcloud/application_default_credentials.json:/app/application_default_credentials.json:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/minn-studio.db
      - STORAGE_PATH=/app/storage
      - GOOGLE_CLOUD_PROJECT=project-cd417e48-66bd-46d2-ad5
      - GOOGLE_APPLICATION_CREDENTIALS=/app/minn-key.json
    
    # Enforce precise resource limits to mimic small VM constraints
    deploy:
      resources:
        limits:
          cpus: '1.0'        # Maximum 1 CPU core
          memory: 1024M      # Maximum 1GB RAM memory
        reservations:
          memory: 512M       # Ensure at least 512MB RAM
